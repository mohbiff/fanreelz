# Fanreelz on Netlify: the site is plain files, no build step.
[build]
  publish = "."
  functions = "netlify/functions"

# Every page has its own address (fanreelz.com/film/…, /about …). They are all served by index.html,
# which reads the address and opens the right page. Real files (privacy.html, terms.html) and /api/* are untouched.
[[redirects]]
  from = "/film/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/shorts/*"
  to = "/index.html"
  status = 200
