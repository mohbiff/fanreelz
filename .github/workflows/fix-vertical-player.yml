name: Fix vertical film player

on:
  push:
    paths:
      - '.github/workflows/fix-vertical-player.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix vertical detection for linked YouTube films
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''function checkVert(f){if(!f||!f.yt)return;const apply=v=>{f.vert=v;const pl=document.querySelector(".player");if(pl&&state.film===f.id)pl.classList.toggle("vert",v)};
  if(f.yt in vertSeen){apply(vertSeen[f.yt]);return}
  const im=new Image();im.onload=()=>{vertSeen[f.yt]=im.naturalHeight>im.naturalWidth*1.1;apply(vertSeen[f.yt])};im.onerror=()=>{vertSeen[f.yt]=false;apply(false)};
  im.src="https://i.ytimg.com/vi/"+f.yt+"/oardefault.jpg"}'''
          new = '''function checkVert(f){if(!f||!f.yt)return;const apply=v=>{f.vert=v;const pl=document.querySelector(".player");if(pl&&state.film===f.id)pl.classList.toggle("vert",v)};
  if(f.yt in vertSeen){apply(vertSeen[f.yt]);return}
  const test=(files,i=0)=>{if(i>=files.length){vertSeen[f.yt]=false;apply(false);return}const im=new Image();
    im.onload=()=>{const v=im.naturalHeight>im.naturalWidth*1.1;if(v||i===files.length-1){vertSeen[f.yt]=v;apply(v)}else test(files,i+1)};
    im.onerror=()=>test(files,i+1);im.src="https://i.ytimg.com/vi/"+f.yt+"/"+files[i]};
  test(["oardefault.jpg","maxresdefault.jpg","sddefault.jpg","hqdefault.jpg"])}'''
          if old not in s:
              raise SystemExit('Expected checkVert function not found; refusing to change index.html')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix vertical detection for direct film links"
          git push
