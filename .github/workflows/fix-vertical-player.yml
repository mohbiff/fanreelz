name: Fix vertical film player

on:
  push:
    paths:
      - '.github/workflows/fix-vertical-player.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make vertical linked films use a portrait player
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '.player.vert.hasbar iframe{aspect-ratio:9/16;width:auto!important;height:min(78vh,calc((100vw - 32px)*16/9),760px)!important;margin:0 auto}'
          new = '''.player.vert.hasbar{aspect-ratio:9/16;width:min(100%,calc(78vh * 9 / 16),428px);height:auto;margin-left:auto;margin-right:auto}\n.player.vert.hasbar iframe{aspect-ratio:9/16;width:100%!important;height:100%!important;margin:0 auto}\n@media (max-width:860px) and (orientation:portrait){\n  .theater:has(.player.vert){margin-left:-12px;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:0;padding-right:0}\n  .theater .player.vert.hasbar{width:min(100vw,calc((100dvh - 112px) * 9 / 16));height:min(calc(100dvh - 112px),calc(100vw * 16 / 9));max-width:100vw;aspect-ratio:9/16;margin:0 auto}\n  .theater .player.vert.hasbar iframe{width:100%!important;height:100%!important;aspect-ratio:9/16}\n}'''
          if old not in s:
              raise SystemExit('Expected vertical player rule not found; refusing to change index.html')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix portrait player for direct film links"
          git push
