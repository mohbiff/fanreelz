# Builds the Fanreelz Android app (for Google Play) whenever the android folder changes, or by hand:
# GitHub → Actions → "Android app" → Run workflow. The finished files are under the run's "Artifacts":
#   fanreelz-play.aab  → upload this to Google Play Console
#   fanreelz.apk       → install directly on a phone to test
# Signing uses two repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    the upload key file, as base64 text
#   KEYSTORE_PASSWORD  its password
name: Android app

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key"
          else
            echo "::warning::No KEYSTORE_BASE64 secret yet: the Google Play file is unsigned, and the test APK uses a temporary key (the app will show a browser bar)"
          fi

      - name: Build
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then TASKS="bundleRelease assembleRelease"; else TASKS="bundleRelease assembleDebug"; fi
          # on failure, show Gradle's explanation as an error note on the run page
          if ! gradle --no-daemon --console=plain $TASKS > ../gradle.log 2>&1; then
            tail -n 120 ../gradle.log
            msg=$(sed -n '/What went wrong/,/Try:/p' ../gradle.log | head -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -z "$msg" ] && msg=$(grep -iE "error|exception" ../gradle.log | tail -n 25 | head -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle::$msg"
            exit 1
          fi
          mkdir -p ../out
          cp app/build/outputs/bundle/release/*.aab ../out/fanreelz-play.aab
          cp app/build/outputs/apk/release/*.apk ../out/fanreelz.apk 2>/dev/null || cp app/build/outputs/apk/debug/*.apk ../out/fanreelz.apk
          ls -la ../out

      - uses: actions/upload-artifact@v5
        with:
          name: fanreelz-android-${{ github.run_number }}
          path: out/

      # The website's "Download for Android" button (fanreelz.com/android.apk) always gets the newest app from this release
      - name: Publish the app for download from the website
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create app --repo "$GITHUB_REPOSITORY" --title "Fanreelz Android app" --notes "The newest Fanreelz Android app. On your phone: download fanreelz.apk, open it and tap Install."
          gh release upload app out/fanreelz.apk --clobber --repo "$GITHUB_REPOSITORY"
