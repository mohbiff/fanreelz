// Fanreelz for Android: fanreelz.com in Android's own web view, so the app controls full screen like YouTube.
// Built by GitHub Actions (.github/workflows/android.yml); no Android Studio needed.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Fanreelz"
include ":app"
