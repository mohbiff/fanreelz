<style>
/* Layout: video-site shell · top bar (menu, logo, centered search, actions) · left guide rail · chip row · thumbnail grid; watch view = player column + "Up next" column */
:root{
  --bg:#fbfafd; --surface:#ffffff; --hover:#efecf4; --chip:#ebe7f1; --fg:#17141f; --muted:#625b73; --line:#e1dce9;
  --live:#dc2626; --accent:#a16207; --accent-soft:#fef3c7; --star:#d97706; --ink-on-accent:#ffffff; --scrim:rgba(10,8,16,.55);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#110f17; --surface:#17141f; --hover:#262132; --chip:#272231; --fg:#f1edf7; --muted:#a69db9; --line:#2d2739;
  --live:#f05252; --accent:#ffd23f; --accent-soft:#3a3110; --star:#fbbf24; --ink-on-accent:#1a1405; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110f17; --surface:#17141f; --hover:#262132; --chip:#272231; --fg:#f1edf7; --muted:#a69db9; --line:#2d2739;
  --live:#f05252; --accent:#ffd23f; --accent-soft:#3a3110; --star:#fbbf24; --ink-on-accent:#1a1405; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);height:56px;display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--hover)}
.zz{display:inline-block;color:var(--accent);font-size:1.32em;line-height:.8;transform:skewX(-14deg) translateY(.04em);margin-left:.02em;position:relative;font-weight:800}
.zz::after{content:"";position:absolute;left:-.06em;right:-.12em;bottom:-.2em;height:.13em;border-radius:.1em;background:var(--accent);transform:skewX(14deg)}
.logo{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.03em;background:none;border:0;padding:0}
.word-tag{font-family:inherit;font-weight:500;font-size:12.5px;letter-spacing:0;color:var(--muted);margin-left:6px;padding-left:11px;border-left:1px solid var(--line);white-space:nowrap}
@media (max-width:1100px){.logo .word-tag{display:none}}
.logo .mark{width:26px;height:26px;color:var(--accent);display:grid;place-items:center}
.logo .mark svg{width:26px;height:26px}
.searchwrap{flex:1;display:flex;justify-content:center;min-width:0}
.search{display:flex;width:100%;max-width:600px;height:40px}
.search input{flex:1;min-width:0;border:1px solid var(--line);border-right:0;border-radius:20px 0 0 20px;background:var(--surface);padding:0 16px;outline:none}
.search input:focus{border-color:var(--accent)}
.search button{width:62px;border:1px solid var(--line);border-radius:0 20px 20px 0;background:var(--chip);display:grid;place-items:center}
.actions{display:flex;align-items:center;gap:6px}
.createbtn{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 10px;border-radius:18px;border:0;background:var(--chip);font-weight:600}
.createbtn:hover{background:var(--hover)}
.signin{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:none;color:var(--accent);font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--chip);flex:none}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr)}
.shell.mini{grid-template-columns:72px minmax(0,1fr)}
.guide{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px - env(safe-area-inset-top,0px));overflow-y:auto;padding:4px 12px 24px max(12px,env(safe-area-inset-left,0px))}
.guide h4{margin:12px 12px 4px;font-size:15px;font-weight:700}
.guide hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.gi{display:flex;align-items:center;gap:20px;width:100%;height:40px;padding:0 12px;border-radius:10px;border:0;background:none;text-align:left;white-space:nowrap;overflow:hidden}
.gi:hover{background:var(--hover)}
.gi.on{background:var(--chip);font-weight:700}
.gi .dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.gi span{overflow:hidden;text-overflow:ellipsis}
.shell.mini .guide{padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:4px}
.shell.mini .gi{flex-direction:column;height:auto;padding:14px 0 12px;gap:6px;font-size:10px;justify-content:center}
.shell.mini .guide h4,.shell.mini .guide hr,.shell.mini .gi.cat{display:none}

main{min-width:0;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:12px;padding-bottom:40px}
.chips{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:4;background:var(--bg);display:flex;gap:12px;overflow-x:auto;padding:10px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:8px;border:0;background:var(--chip);font-weight:600;white-space:nowrap}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--fg);color:var(--bg)}

.shelf{margin:4px 0 28px}
.shelf h2,.sect-h{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;margin:0 0 14px}
.shelf h2 svg{color:var(--accent)}
.shelfrow{display:grid;grid-auto-flow:column;grid-auto-columns:max(210px,calc((100% - 64px) / 5));gap:16px;overflow-x:auto;padding-bottom:6px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px 16px}
.vid{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:12px;min-width:0}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:var(--chip)}
.thumb canvas{display:block;width:100%;height:100%;transition:transform .25s}
.vid:hover .thumb canvas{transform:scale(1.03)}
.thumb .len{position:absolute;right:8px;bottom:8px;font-size:12px;font-weight:600;background:rgba(0,0,0,.75);color:#fff;padding:1px 5px;border-radius:4px}
.thumb .rank{position:absolute;left:8px;bottom:6px;font-family:var(--display);font-size:34px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);line-height:1}
.vinfo{display:flex;gap:12px;min-width:0}
.cav{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}
.vtext{min-width:0;display:flex;flex-direction:column;gap:3px}
.vtitle{font-size:16px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.vmeta{color:var(--muted);font-size:14px}
.vmeta .st{color:var(--star)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:1px;margin-left:4px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.earlyfan{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;line-height:1;padding:3px 7px;border-radius:999px;background:rgba(255,210,63,.16);color:var(--accent);vertical-align:middle;white-space:nowrap}h1 .earlyfan{font-size:13px}
.adm-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.adm-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.adm-card b{font-size:26px;line-height:1.1}.adm-card span{color:var(--muted);font-size:13px}
.adm-list{display:flex;flex-direction:column;gap:6px}
.adm-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.adm-row img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.adm-who{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}.adm-who span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.adm-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.adminbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px}.adminbox input{flex:1 1 220px;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}.adminbox p{flex-basis:100%;margin:0;font-size:13px}.adminbox b{display:flex;gap:6px;align-items:center;font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:36px}

/* watch view */
@media (max-width:860px){[data-theater]{display:none!important}.pbar{display:none}}
@media (min-width:861px){.wfsbtn{display:none!important}}
/* Fanreelz's own controls on YouTube films: YouTube's controls are switched off, so its share, watch-later and logo can't show through */
/* Fanreelz controls for YouTube films sit UNDER the video (YouTube's rules: nothing on top of its player). YouTube's own controls are off (controls=0) */
.player.hasbar{aspect-ratio:auto;overflow:hidden}
.player.hasbar iframe{position:relative!important;inset:auto!important;display:block;width:100%!important;height:auto!important;aspect-ratio:16/9;border:0}
.fpbar{position:relative;padding:6px 10px 8px;background:rgba(18,14,26,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);user-select:none;-webkit-user-select:none}
.player.hasbar:fullscreen,body.wfs .player.hasbar{display:flex;flex-direction:column;justify-content:center;background:#000}
.player.hasbar:fullscreen{width:100vw;height:100vh;border-radius:0}
.player.hasbar:fullscreen iframe,body.wfs .player.hasbar iframe{flex:1;aspect-ratio:auto;min-height:0;height:auto!important}
.player.ended iframe{visibility:hidden}
.fpbar.fshide{visibility:hidden}
.player.hasbar:-webkit-full-screen{display:flex;flex-direction:column;justify-content:center;background:#000;width:100vw;height:100vh}
.fpseek{width:100%;margin:0 0 6px;height:20px;accent-color:#f2c94c;cursor:pointer;display:block;opacity:.9}

.tslink{background:none;border:0;padding:0;font:inherit;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.fpb{height:38px;min-width:38px;padding:0 10px;border:0;border-radius:19px;background:transparent;color:rgba(255,255,255,.92);font:600 13px/1 inherit;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.fpb:hover{background:rgba(255,255,255,.12)}.fpb.on{color:#f2c94c;background:rgba(255,255,255,.08)}
.fpb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.fpb svg.fill{fill:currentColor;stroke:none}
.fptime{font:600 13px/1 inherit;font-variant-numeric:tabular-nums;opacity:.9;padding:0 4px}
.fpb .lbl{display:inline}
@media (max-width:600px){.fpb .lbl{display:none}.fpb{padding:0 6px;min-width:34px;height:36px}.fprow{gap:2px}.fpbar{padding:6px}.fptime{font-size:12px;padding:0 2px}}
body.wfs .fpbar{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.theater{background:#000;margin:0 -24px;padding:12px 24px 4px}.theater .player{width:min(100%,calc((100vh - 170px)*16/9));margin:0 auto;border-radius:0}
.theater .pbar,.theater .ythelp{max-width:min(100%,calc((100vh - 170px)*16/9));margin-left:auto;margin-right:auto}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 402px;gap:24px;padding-top:16px;max-width:1700px}
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:#000}
.shelfh{all:unset;cursor:pointer;font:inherit}.shelfh span{color:var(--accent)}.shelfh:hover{text-decoration:underline}
.endnext{position:absolute;inset:0;z-index:7;background:rgba(10,8,18,.94);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:18px;box-sizing:border-box;overflow:auto}
.endtop{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff}.endtop span{color:var(--accent);font-weight:700;font-size:14px}
.endgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.endcard{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:#fff;font-size:13px;font-weight:600}
.endcard .thumb{aspect-ratio:16/9;border-radius:8px;overflow:hidden}.endcard .thumb img,.endcard .thumb canvas{width:100%;height:100%;object-fit:cover}.endcard em{font-style:normal;color:var(--accent)}.endcard:hover .thumb{outline:2px solid var(--accent)}

function paint(cv,f){
  const xp=extOf(f);if(xp){const im=document.createElement("img"),p=cv.parentNode;im.src="/api/thumb?p="+xp.p+"&id="+encodeURIComponent(f[xp.p])+(f.ttUser?"&u="+encodeURIComponent(f.ttUser):"");im.alt="";im.loading="lazy";im.className="ytthumb extthumb";im.onerror=()=>{const d=document.createElement("div");d.className="tttile";d.style.setProperty("--h",f.hue||0);d.innerHTML="<b></b><span></span>";d.firstChild.textContent=xp.name;d.lastChild.textContent=f.title;im.replaceWith(d)};cv.replaceWith(im);p&&p.insertAdjacentHTML("beforeend",'<span class="ttbadge">'+xp.name+'</span>');return}
  if(f.age&&cv.parentNode)cv.parentNode.insertAdjacentHTML("beforeend",'<span class="agebadge">18+</span>');
  if(f.yt){const im=document.createElement("img");im.src="https://i.ytimg.com/vi/"+f.yt+"/hqdefault.jpg";im.alt="";im.loading="lazy";im.className="ytthumb";cv.replaceWith(im);return}
  const r=cv.getBoundingClientRect();const w=Math.max(80,Math.round(r.width||320)),h=Math.max(45,Math.round(r.height||w*9/16));
  const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=w*dpr;cv.height=h*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);
  let s=f.hue*97+f.title.length;const R=()=>{s=(s*16807)%2147483647;return s/2147483647};
  const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,`hsl(${f.hue},55%,16%)`);g.addColorStop(1,`hsl(${(f.hue+50)%360},60%,34%)`);
  x.fillStyle=g;x.fillRect(0,0,w,h);
  const sun=x.createRadialGradient(w*.7,h*.38,0,w*.7,h*.38,h*.55);sun.addColorStop(0,`hsla(${(f.hue+30)%360},90%,70%,.9)`);sun.addColorStop(1,"hsla(0,0%,0%,0)");
  x.fillStyle=sun;x.fillRect(0,0,w,h);
  for(let l=0;l<3;l++){x.beginPath();x.moveTo(0,h);let y=h*(.55+l*.13);x.lineTo(0,y);
    for(let px=0;px<=w;px+=w/12){y=h*(.5+l*.13)+(R()-.5)*h*.18;x.lineTo(px,y)}x.lineTo(w,h);x.closePath();
    x.fillStyle=`hsla(${f.hue},40%,${8+l*3}%,${.55+l*.18})`;x.fill()}
}

/* Fanreelz views: one per film per visit, counted in the database (table film_views) */
let VIEWS={};const counted=new Set();
const viewsOf=f=>VIEWS[f.id]||0;
/* Fanreelz views are counted from day one but not shown yet; the YouTube count is shown instead */
const VIEW_MIN=Infinity; // hidden for now; set a number (e.g. 1000) to start showing Fanreelz views
const viewTxt=f=>{const v=viewsOf(f);return v>=VIEW_MIN?`${fmtN(v)} views · `:f.ytViews?`${fmtN(f.ytViews)} YouTube views · `:""};
function countView(f){if(!f||counted.has(f.id))return;let seen=[];try{seen=JSON.parse(sessionStorage.getItem("fr_seen")||"[]")}catch(e){}
  counted.add(f.id);if(seen.includes(f.id))return;VIEWS[f.id]=viewsOf(f)+1;
  try{sessionStorage.setItem("fr_seen",JSON.stringify([...seen,f.id].slice(-500)))}catch(e){}
  if(sb)sb.rpc("add_view",{p_id:f.id}).then(({error})=>{if(error)console.warn("view",error.message)})}
async function loadViews(){if(!sb)return;const all={};
  for(let from=0;from<200000;from+=1000){const {data,error}=await sb.from("film_views").select("id,n").range(from,from+999);
    if(error||!data){if(error)console.warn("views",error.message);break}data.forEach(r=>all[r.id]=+r.n||0);if(data.length<1000)break}
  for(const k in VIEWS)if(counted.has(k))all[k]=Math.max(all[k]||0,VIEWS[k]);VIEWS=all;if(Object.keys(all).length)render()}
const metaLine=f=>{const s=stats(f);return `${viewTxt(f)}${s.n?`<span class="st">★</span> ${s.avg.toFixed(1)} · ${fmtN(s.n)} ratings`:"No ratings yet"} · ${f.days==null?"on "+esc(f.src):ago(f.days)}`};

function feedList(){

  let list=allFilms().filter(f=>(!state.cat||f.cat===state.cat)&&(!state.char||f.char===state.char)&&
    (state.cat||state.group==="All"||state.group===FOR_YOU||groupOf(f.cat)?.name===state.group)&&
    (!q||[f.title,f.char,catName(f.cat),byName(f),f.tool].join(" ").toLowerCase().includes(q)));

  const k=state.feed==="new"?f=>f.days:f=>-stats(f).bayes;
  return list.sort((a,b)=>k(a)-k(b));

/* Hover preview: the picture starts moving (muted) when you rest on a card, like on YouTube.
   One preview at a time and only after a short pause, so platforms never see a burst of players.
   TikTok and Instagram cards get a soft colour animation instead, because those players can't be muted. */
let hovT=null,hovEl=null;
function previewSrc(f){
  if(f.age)return "";
  if(f.yt)return `https://www.youtube-nocookie.com/embed/${f.yt}?autoplay=1&mute=1&controls=0&modestbranding=1&playsinline=1&rel=0&loop=1&playlist=${f.yt}`;
  if(f.vm)return `https://player.vimeo.com/video/${f.vm}?background=1&muted=1&autoplay=1&dnt=1`;
  if(f.dm)return `https://geo.dailymotion.com/player.html?video=${f.dm}&mute=true&autoplay=true&controls=false`;
  if(f.tt)return `https://www.tiktok.com/player/v1/${f.tt}?autoplay=0&controls=0&progress_bar=0&play_button=0&volume_control=0&fullscreen_button=0&timestamp=0&loop=1&music_info=0&description=0&rel=0&native_context_menu=0&closed_caption=0`;
  return "";
}
function stopPreview(){clearTimeout(hovT);if(hovEl){hovEl.querySelector(".hovprev")?.remove();hovEl=null}}
document.addEventListener("pointerover",e=>{
  if(e.pointerType==="touch")return;
  const card=e.target.closest("[data-open],[data-short]");const th=card?.querySelector(".thumb");
  if(!th||th===hovEl)return;stopPreview();
  const f=findFilm(card.dataset.open||card.dataset.short);const src=f&&previewSrc(f);if(!src)return;
  hovEl=th;hovT=setTimeout(()=>{if(hovEl!==th)return;th.insertAdjacentHTML("beforeend",`<div class="hovprev"><iframe src="${src}" allow="autoplay; encrypted-media" tabindex="-1" aria-hidden="true" title=""></iframe></div>`)},f.tt?900:700);
});
document.addEventListener("pointerout",e=>{if(hovEl&&!hovEl.closest("[data-open],[data-short]")?.contains(e.relatedTarget))stopPreview()});

let spPaused=false,spTouchY=null,spSlide=0,spSheet="";
function spToggle(){
  const fr=document.querySelector(".sp iframe"),f=findFilm(state.film);if(!fr||!f)return;
  spPaused=!spPaused;const w=fr.contentWindow,cmd=spPaused?"pause":"play";
  if(f.yt)w.postMessage(JSON.stringify({event:"command",func:cmd+"Video",args:[]}),"*");
  else if(f.tt)w.postMessage({"x-tiktok-player":true,type:cmd},"*");
  else if(f.vm)w.postMessage(JSON.stringify({method:cmd}),"*");
  const ic=document.querySelector(".spicon");if(ic){ic.className="spicon "+(spPaused?"paused":"playing");void ic.offsetWidth;ic.classList.add("show")}
}
document.addEventListener("click",e=>{if(e.target.closest(".spcatch")){e.preventDefault();e.stopPropagation();spToggle()}},true);

document.addEventListener("touchmove",e=>{if(spTouchY==null)return;const sp=document.querySelector(".sp");if(sp){sp.style.transition="none";sp.style.transform=`translateY(${Math.max(-140,Math.min(140,(e.touches[0].clientY-spTouchY)*.6))}px)`}},{passive:true});

function spWake(){
  const fr=document.querySelector(".sp iframe"),f=findFilm(state.film);if(!fr||!f||spPaused)return;const w=fr.contentWindow;

const findCat=t=>{t=String(t||"").trim().toLowerCase();return t?CATS.find(c=>c.name.toLowerCase()===t||c.id===t)||CATS.find(c=>c.chars.some(ch=>ch.toLowerCase()===t))||null:null};
function wireCatFields(p){const ci=$("#"+p+"Cat"),dl=$("#"+p+"CharList"),note=$("#"+p+"CatNote");
  const sync=()=>{const c=findCat(ci.value);const seen=new Set();const chars=c?[...c.chars,...rawFilms().filter(f=>f.cat===c.id).map(f=>f.char)]:[];
    dl.innerHTML=chars.filter(ch=>ch&&!seen.has(ch.toLowerCase())&&seen.add(ch.toLowerCase())).slice(0,40).map(ch=>`<option value="${esc(ch)}">`).join("");
    note.textContent=ci.value.trim()&&!c?"New category: it will show under Original worlds until we add it to the list.":""};
  ci.addEventListener("input",sync);sync()}

/* ================= Sign-in and database on fanreelz.com (Supabase) =================
   The site was first built against a small document store (collections of per-user documents).
   This adapter gives Supabase the same shape, so every feature (ratings, comments, votes, playlists,
   follows, requests, tips, submissions) saves for real without being rewritten. */
var sb=null,sbToken=null,sbTokenNote=""; // var: pages opened by a direct link are drawn before this line runs
const loadScript=src=>new Promise((ok,bad)=>{const t=document.createElement("script");t.src=src;t.onload=ok;t.onerror=bad;document.head.appendChild(t)});
const initialAvatar=name=>{const n=(name||"F").trim()[0]?.toUpperCase()||"F",h=hnum(name||"F")%360;
  return "data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" rx="20" fill="hsl(${h} 55% 45%)"/><text x="20" y="26" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">${n.replace(/[<&>"]/g,"")}</text></svg>`)};
function supabaseDb(uid){
  const listeners=new Map(),timers={};
  const run=col=>{clearTimeout(timers[col]);timers[col]=setTimeout(()=>{for(const fn of listeners.get(col)||[])fn()},150)};
  const watch=(col,fn)=>{if(!listeners.has(col))listeners.set(col,new Set());listeners.get(col).add(fn);fn()};
  const split=path=>{const i=path.lastIndexOf("/");return [path.slice(0,i),path.slice(i+1)]};
  sb.channel("fanreelz-docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{const col=p.new?.col||p.old?.col;if(col)run(col);else for(const c of listeners.keys())run(c)}).subscribe();
  return {
    collection(col){return {onSnapshot(cb,err){watch(col,async()=>{const {data,error}=await sb.from("docs").select("id,data").eq("col",col).limit(5000);
      if(error){err&&err(error);return}cb({docs:data.map(r=>({id:r.id,exists:true,data:()=>r.data}))})})}}},
    doc(path){const [col,id]=split(path);return {
      onSnapshot(cb,err){watch(col,async()=>{const {data,error}=await sb.from("docs").select("data").eq("col",col).eq("id",id).maybeSingle();
        if(error){err&&err(error);return}cb({id,exists:!!data,data:()=>data?.data})})},
      async set(data){if(!uid)throw new Error("signed out");await sbSave(col,id,data);run(col)}
    }}
  };
}

async function startSupabase(){
  let cfg={};try{cfg=await (await fetch("/api/config")).json()}catch(e){return null}
  discordAppId=String(cfg.discordAppId||"");if(state.view==="discord")render();
  if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)return null;
  try{await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js")}catch(e){return null}
  // Our own storage for the sign-in: kept in memory too, and every removal is logged, so a lost sign-in can be traced.
  const mem={},sbStorage={
    getItem:k=>{try{const v=localStorage.getItem(k);if(v!=null)return v}catch(e){}return mem[k]??null},
    setItem:(k,v)=>{mem[k]=v;try{localStorage.setItem(k,v)}catch(e){console.warn("[fanreelz auth] could not save sign-in in this browser:",e.message)}},
    removeItem:k=>{console.warn("[fanreelz auth] sign-in data removed:",k);console.trace();delete mem[k];try{localStorage.removeItem(k)}catch(e){}}};
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce",storage:sbStorage,debug:/[?&]authdebug/.test(location.search)}});
  const {data:{session}}=await sb.auth.getSession();
  {const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));const er=q.get("error_description")||h.get("error_description");if(er)setTimeout(()=>toast("Sign-in failed: "+er.slice(0,140)),600)}
  if(/[?&](code|error)=/.test(location.search)){const u=new URL(location.href);["code","error","error_description","error_code"].forEach(k=>u.searchParams.delete(k));history.replaceState(history.state,"",u.pathname+u.search+u.hash)}
  if(/[#&](error|access_token)=/.test(location.hash))history.replaceState(history.state,"",location.pathname+location.search);
  let signedIn=!!session;sbToken=session?.access_token||null;
  sb.auth.onAuthStateChange((ev,sess)=>{if(sess?.access_token)sbToken=sess.access_token;sbTokenNote=ev;if(!!sess!==signedIn&&ev!=="TOKEN_REFRESHED")location.reload()});
  const u=session?.user;let me=null;
  if(u){const meta=u.user_metadata||{};const {data:prof}=await sb.from("profiles").select("name,avatar_url,created_at").eq("id",u.id).maybeSingle();
    const name=prof?.name||meta.full_name||meta.name||meta.user_name||"Fan";
    me={id:u.id,joined:prof?.created_at||u.created_at||"",name,avatarUrl:prof?.avatar_url||meta.avatar_url||initialAvatar(name),provider:u.app_metadata?.provider||""}}
  const user={me:async()=>me||{},profiles:async ids=>{const out={};if(!ids.length)return out;
    const {data}=await sb.from("profiles").select("id,name,avatar_url,created_at").in("id",ids.slice(0,300));for(const r of data||[]){out[r.id]={name:r.name||"Fan",avatar:r.avatar_url||""};if(r.created_at)joined[r.id]=r.created_at}return out}};
  loadCatalog().catch(e=>console.warn("catalogue",e));
  loadViews().catch(e=>console.warn("views",e));
  if(u)setTimeout(checkMod,0);
  return {user,db:supabaseDb(me?.id||null),me};
}
/* Save one document. Sends the signed-in user's token explicitly, and if the database still
   doesn't see a signed-in user, refreshes the sign-in once and tries again. */
const jwtInfo=t=>{try{const p=JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));return {role:p.role,exp:p.exp,sub:p.sub}}catch(e){return {}}};
async function sbSave(col,id,data){
  const call=async()=>{const g=await sb.auth.getSession();if(g.error)sbTokenNote="getSession: "+g.error.message;
    const tok=g.data?.session?.access_token||sbToken;const q=sb.rpc("save_doc",{p_col:col,p_id:id,p_data:data});
    if(tok&&q.headers)q.headers["Authorization"]="Bearer "+tok;
    const r=await q;return {error:r.error,tok}};
  let {error,tok}=await call();
  if(error&&/not see you as signed in/.test(error.message||"")){const rr=await sb.auth.refreshSession().catch(e=>({error:e}));if(rr?.data?.session?.access_token)sbToken=rr.data.session.access_token;else if(rr?.error)sbTokenNote="refresh: "+(rr.error.message||rr.error);({error,tok}=await call())}
  if(error){const i=tok?jwtInfo(tok):null;
    console.warn("Fanreelz save failed",error,i);
    throw new Error((error.message||"error")+(i?` [token role: ${i.role||"?"}, expires ${i.exp?new Date(i.exp*1000).toLocaleTimeString():"?"}]`:" [no sign-in token in this browser]")+(sbTokenNote?` [${sbTokenNote}]`:""))}
}
/* The big catalogue: AI fan films the importer has found on YouTube, read from the database in pages of 1,000 */

  }
  const have=new Set(FILMS.map(f=>f.id)),known=new Set(CATS.map(c=>c.id));let n=0;
  rows.forEach((r,k)=>{if(have.has(r.id)||!known.has(r.cat))return;have.add(r.id);

    FILMS.push({id:r.id,yt:r.video_id,title:r.title,cat:r.cat,char:r.char||"",src:"YouTube",tool:"AI tools",by:r.channel||"",
      len:d?`${Math.floor(d/60)}:${String(d%60).padStart(2,"0")}`:"",days:r.published_at?daysSince(Date.parse(r.published_at)):null,
      counts:[0,0,0,0,0],hue:(k*47)%360,format:r.format==="short"?"short":"film",lore:r.lore||"whatif",boost:Math.max(0,20-k/50),
