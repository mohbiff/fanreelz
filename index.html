<style>
/* Layout: video-site shell · top bar (menu, logo, centered search, actions) · left guide rail · chip row · thumbnail grid; watch view = player column + "Up next" column */
:root{
  --bg:#fbfafd; --surface:#ffffff; --hover:#efecf4; --chip:#ebe7f1; --fg:#17141f; --muted:#625b73; --line:#e1dce9;
  --live:#dc2626; --accent:#a16207; --accent-soft:#fef3c7; --star:#d97706; --ink-on-accent:#ffffff; --scrim:rgba(10,8,16,.55);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1923; --surface:#23202c; --hover:#302b3b; --chip:#322c3d; --fg:#f1edf7; --muted:#ada4bf; --line:#3a3348;
  --live:#f05252; --accent:#ffd23f; --accent-soft:#3a3110; --star:#fbbf24; --ink-on-accent:#1a1405; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1923; --surface:#23202c; --hover:#302b3b; --chip:#322c3d; --fg:#f1edf7; --muted:#ada4bf; --line:#3a3348;
  --live:#f05252; --accent:#ffd23f; --accent-soft:#3a3110; --star:#fbbf24; --ink-on-accent:#1a1405; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
/* nothing may make the page wider than the screen (long titles, wide embeds): no sideways scrollbar */
html,body{overflow-x:clip}
.vtitle,.vmeta,.cmbody p,.adm-who span{overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* no blue tap flash on Android (the browser default); keyboard focus still shows the outline above */
html{-webkit-tap-highlight-color:transparent}*{-webkit-tap-highlight-color:transparent}:focus:not(:focus-visible){outline:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);height:56px;display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--hover)}
.zz{display:inline-block;color:var(--accent);font-size:1.32em;line-height:.8;transform:skewX(-14deg) translateY(.04em);margin-left:.02em;position:relative;font-weight:800}
.zz::after{content:"";position:absolute;left:-.06em;right:-.12em;bottom:-.2em;height:.13em;border-radius:.1em;background:var(--accent);transform:skewX(14deg)}
.logo{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.03em;background:none;border:0;padding:0}
.word-tag{font-family:inherit;font-weight:500;font-size:12.5px;letter-spacing:0;color:var(--muted);margin-left:6px;padding-left:11px;border-left:1px solid var(--line);white-space:nowrap}
@media (max-width:1100px){.logo .word-tag{display:none}}
.logo .mark{width:26px;height:26px;color:var(--accent);display:grid;place-items:center}
.logo .mark svg{width:26px;height:26px}
.searchwrap{flex:1;display:flex;justify-content:center;min-width:0}
.search{display:flex;width:100%;max-width:600px;height:40px}
.search input{flex:1;min-width:0;border:1px solid var(--line);border-right:0;border-radius:20px 0 0 20px;background:var(--surface);padding:0 16px;outline:none}
.search input:focus{border-color:var(--accent)}
.search button{width:62px;border:1px solid var(--line);border-radius:0 20px 20px 0;background:var(--chip);display:grid;place-items:center}
.actions{display:flex;align-items:center;gap:6px}
.createbtn{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 10px;border-radius:18px;border:0;background:var(--chip);font-weight:600}
.createbtn:hover{background:var(--hover)}
.signin{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:none;color:var(--accent);font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--chip);flex:none}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr)}
.shell.mini{grid-template-columns:72px minmax(0,1fr)}
.guide{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px - env(safe-area-inset-top,0px));overflow-y:auto;padding:4px 12px 24px max(12px,env(safe-area-inset-left,0px))}
.guide h4{margin:12px 12px 4px;font-size:15px;font-weight:700}
.guide hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.gi{display:flex;align-items:center;gap:20px;width:100%;height:40px;padding:0 12px;border-radius:10px;border:0;background:none;text-align:left;white-space:nowrap;overflow:hidden}
.gi:hover{background:var(--hover)}
.gi.on{background:var(--chip);font-weight:700}
.gi .dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.gi span{overflow:hidden;text-overflow:ellipsis}
.shell.mini .guide{padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:4px}
.shell.mini .gi{flex-direction:column;height:auto;padding:14px 0 12px;gap:6px;font-size:10px;justify-content:center}
.shell.mini .guide h4,.shell.mini .guide hr,.shell.mini .gi.cat{display:none}

main{min-width:0;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:12px;padding-bottom:40px}
.chips{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:4;background:var(--bg);display:flex;gap:12px;overflow-x:auto;padding:10px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:8px;border:0;background:var(--chip);font-weight:600;white-space:nowrap}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--fg);color:var(--bg)}

.shelf{margin:4px 0 28px}
.shelf h2,.sect-h{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;margin:0 0 14px}
.shelf h2 svg{color:var(--accent)}
.shelfrow{display:grid;grid-auto-flow:column;grid-auto-columns:max(210px,calc((100% - 64px) / 5));gap:16px;overflow-x:auto;padding-bottom:6px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px 16px}
.vid{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:12px;min-width:0}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:var(--chip)}
.thumb canvas{display:block;width:100%;height:100%;transition:transform .25s}
.vid:hover .thumb canvas{transform:scale(1.03)}
.thumb .len{position:absolute;right:8px;bottom:8px;font-size:12px;font-weight:600;background:rgba(0,0,0,.75);color:#fff;padding:1px 5px;border-radius:4px}
.thumb .rank{position:absolute;left:8px;bottom:6px;font-family:var(--display);font-size:34px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);line-height:1}
.vinfo{display:flex;gap:12px;min-width:0}
.cav{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}
.vtext{min-width:0;display:flex;flex-direction:column;gap:3px}
.vtitle{font-size:16px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.vmeta{color:var(--muted);font-size:14px}
.vmeta .st{color:var(--star)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:1px;margin-left:4px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.hometag{text-align:center;margin:2px auto 12px;max-width:640px;color:var(--muted);font-size:14.5px;line-height:1.45}.hometag-l{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--accent);cursor:pointer;white-space:nowrap}.hometag-l:hover{text-decoration:underline}
.earlyfan{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;line-height:1;padding:3px 7px;border-radius:999px;background:rgba(255,210,63,.16);color:var(--accent);vertical-align:middle;white-space:nowrap}h1 .earlyfan{font-size:13px}
.adm-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.adm-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.adm-card b{font-size:26px;line-height:1.1}.adm-card span{color:var(--muted);font-size:13px}
.adm-list{display:flex;flex-direction:column;gap:6px}
.instbar{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:150;animation:instin .35s ease-out;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.instbar span:nth-child(2){display:flex;flex-direction:column;flex:1;min-width:0}.instbar small{color:var(--muted);font-size:12px}.instbar .btn{padding:8px 14px}
.instic{width:34px;height:34px;border-radius:9px;background:#8b5cf6 url("/icons/icon-192.png?v=2") center/cover;flex-shrink:0}
@keyframes instin{from{transform:translateY(-130%);opacity:0}to{transform:none;opacity:1}}
.instbar.iab{text-decoration:none;color:var(--fg);position:relative;left:auto;right:auto;top:auto;z-index:auto;animation:none;border-radius:0;border-width:0 0 1px;box-shadow:none;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.instx{background:none;border:0;color:var(--muted);font-size:16px;width:32px;height:32px;cursor:pointer}
.admtbl{width:100%;border-collapse:collapse;font-size:13px}.admtbl th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}.admtbl td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.admtbl tr:hover td{background:var(--hover)}
.affrow{display:flex;align-items:center;gap:12px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--fg);text-decoration:none}
.affrow:hover{background:var(--hover)}.affrow b{font-size:14px}.affrow em{font-style:normal;margin-left:auto;font-weight:700;color:var(--accent);white-space:nowrap}
.affnote{font-size:11px;color:var(--muted);margin:4px 2px 0}
.umplus{font-style:normal;color:#3ecf8e;font-size:.6em;font-weight:700;margin-left:6px;vertical-align:middle}
.umrow .umplus{position:relative;font-size:12px;margin:0 2px 0 0;vertical-align:baseline}
.adm-link{font-size:12.5px;color:var(--accent);text-decoration:none;overflow-wrap:anywhere;margin-top:2px}.adm-link:hover{text-decoration:underline}
.adm-row[data-adminuser]{cursor:pointer}.adm-row[data-adminuser]:hover{border-color:var(--accent)}
.adm-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.adm-row img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.adm-who{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}.adm-who span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.adm-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.adminbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px}.adminbox input{flex:1 1 220px;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}.adminbox p{flex-basis:100%;margin:0;font-size:13px}.adminbox b{display:flex;gap:6px;align-items:center;font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:36px}

/* watch view */
@media (max-width:860px){[data-theater]{display:none!important}.pbar{display:none!important}}
@media (min-width:861px){.wfsbtn{display:none!important}}
/* Fanreelz's own controls on YouTube films: YouTube's controls are switched off, so its share, watch-later and logo can't show through */
/* Fanreelz controls for YouTube films sit UNDER the video (YouTube's rules: nothing on top of its player). YouTube's own controls are off (controls=0) */
.player.hasbar{aspect-ratio:auto;overflow:hidden}
.player.hasbar iframe{position:relative!important;inset:auto!important;display:block;width:100%!important;height:auto!important;aspect-ratio:16/9;border:0}
.fpbar{position:relative;padding:6px 10px 8px;background:rgba(18,14,26,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);user-select:none;-webkit-user-select:none}
.player.hasbar:fullscreen,body.wfs .player.hasbar{display:flex;flex-direction:column;justify-content:center;background:#000}
.player.hasbar:fullscreen{width:100vw;height:100vh;border-radius:0}
/* full screen: YouTube's player fills the screen except two 56px strips at the sides, which are Fanreelz's own ±10 s buttons (not on top of the video) */
.player.hasbar:fullscreen iframe,body.wfs .player.hasbar iframe{flex:1;aspect-ratio:auto;width:calc(100% - 112px)!important;min-height:0;height:auto!important;margin:0 auto}
.player.ended iframe{visibility:hidden}
.umbox h3 .seeall{float:right;margin:0}.umsearch{width:100%;box-sizing:border-box;margin:0 0 10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
.umrank{position:relative;width:28px;color:var(--muted,#999);font-size:12px;text-align:right;flex:none}
.umgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.umbox{background:var(--bg2,#1b1724);border:1px solid var(--line);border-radius:12px;padding:14px}.umbox h3{margin:0 0 10px;font-size:15px}
.umrow{position:relative;display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:13.5px;border-radius:6px;overflow:hidden}
.umbar{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.14;border-radius:6px}
.umname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}.umrow b,.umrow small{position:relative}.umrow small{color:var(--muted,#999);width:34px;text-align:right}
.edgegrab{display:none;position:absolute;left:0;top:0;bottom:64px;width:64px;z-index:6;touch-action:pan-y}
/* Miniplayer: swipe the video down (or tap ⌄) and it keeps playing in a small bar while you browse, like YouTube */
/* phones: a see-through layer over the picture takes the finger before YouTube does — tap = play/pause, swipe down = miniplayer, up = full screen */
.fpcatch{display:none;position:absolute;left:0;right:0;top:0;bottom:var(--fpbarh,72px);z-index:4;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.fpzone{z-index:6}
.fpcenter{display:none;position:absolute;left:50%;top:calc((100% - var(--fpbarh,72px))/2);transform:translate(-50%,-50%);z-index:6;width:68px;height:68px;border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;align-items:center;justify-content:center;padding:0;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.fpcenter svg{width:34px;height:34px;fill:#fff;stroke:none}
@media (max-width:860px){.player.hasbar:not(.ytctrl) .fpcenter{display:flex}}
body.fsmode .player.hasbar:not(.ytctrl) .fpcenter,body.wfs .player.hasbar:not(.ytctrl) .fpcenter{display:flex}
.player.fpctl .fpcenter,.player.fppaused .fpcenter{opacity:1;pointer-events:auto}.player.ended .fpcenter{display:none!important}
.dragzone{display:none;position:absolute;left:0;width:56px;top:0;height:52px;z-index:7;touch-action:none}
.dragzone button{position:absolute;left:6px;top:6px;width:40px;height:40px;border:0;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.dragzone svg,#mini svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#mini{position:fixed;z-index:45;left:0;right:0;bottom:var(--tabh,calc(54px + env(safe-area-inset-bottom,0px)));height:64px;display:flex;align-items:center;gap:10px;background:var(--bg2,#1b1724);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.25)}

  // rows that scroll sideways only keep the swipe when they can scroll back (a row already at its start can't move right anyway)
  const skip=t=>{const row=t.closest(".shelfrow,.shortrow,.chips,.lorebar,.fmtbar");if(row&&row.scrollLeft>2)return true;
    return !!t.closest(".endgrid,.fpbar,.fpzone,.sp,.dlg,#guide,#menuBack,input,textarea,select,[contenteditable]")};

    const t=e.touches[0];if(t.clientX>innerWidth*.6&&!e.target.closest(".edgegrab"))return;sw={x:t.clientX,y:t.clientY,at:Date.now()}},{passive:true});

    if(Math.abs(dy)>40&&Math.abs(dy)>Math.abs(dx)){sw=null;return}

const EP_RES=[[/\bS(\d{1,2})\s*[|:.\-]?\s*E(\d{1,3})\b/i,2],[/\bseason\s*(\d{1,2})\b[^|]{0,30}?\b(?:episode|ep\.?)\s*#?\s*(\d{1,3})\b/i,2],[/\b(?:episode|ep\.?|eps)\s*#?\s*(\d{1,3})\b/i,1],[/\b(?:part|pt\.|chapter|chap\.)\s*#?\s*(\d{1,3})\b/i,1]];

function parseEpisode(title){
  for(const [re,n] of EP_RES){const m=String(title).match(re);if(!m)continue;
    const season=n===2?+m[1]:1,ep=+m[n];if(!ep||ep>300)return null;
    const rest=(title.slice(0,m.index)+" "+title.slice(m.index+m[0].length)).replace(/[\[(]\s*[\])]/g," ");
    const segs=rest.split(/\s*[|:–—]\s*|\s+-\s+/).map(x=>x.replace(/[\s#,.!]+$/,"").replace(/^[\s#,.!]+/,"").trim()).filter(x=>x&&!GENERIC_SEG.test(x));
    if(!segs.length)return null;
    return {season,ep,name:segs[0],segs}}

  for(const fs of FOLLOWED_SERIES){
    const eps=films.filter(f=>fs.re.test(f.by||"")&&(f.yt||f.tt)).sort((a,b)=>(b.days??0)-(a.days??0));if(!eps.length)continue;
    const id="as-"+slugify(fs.title),cnt={};

/* Save one document. Sends the signed-in user's token explicitly, and if the database still

const jwtInfo=t=>{try{const p=JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));return {role:p.role,exp:p.exp,sub:p.sub}}catch(e){return {}}};
async function sbSave(col,id,data){
  const call=async()=>{const g=await sb.auth.getSession();if(g.error)sbTokenNote="getSession: "+g.error.message;
    const tok=g.data?.session?.access_token||sbToken;const q=sb.rpc("save_doc",{p_col:col,p_id:id,p_data:data});
    if(tok&&q.headers)q.headers["Authorization"]="Bearer "+tok;
    const r=await q;return {error:r.error,tok}};
  let {error,tok}=await call();

  if(error){const i=tok?jwtInfo(tok):null;
    console.warn("Fanreelz save failed",error,i);
    throw new Error((error.message||"error")+(i?` [token role: ${i.role||"?"}, expires ${i.exp?new Date(i.exp*1000).toLocaleTimeString():"?"}]`:" [no sign-in token in this browser]")+(sbTokenNote?` [${sbTokenNote}]`:""))}

/* The big catalogue: AI fan films the importer has found on YouTube, read from the database in pages of 1,000 */
/* The big catalogue: AI fan films the importer has found on YouTube.
   The last copy is kept on the device (IndexedDB), so the page shows every film at once on the next visit;
   a fresh copy is then read from the database in parallel pages of 1,000 (only the columns the page uses). */
const CAT_COLS="id,video_id,title,cat,char,channel,duration,published_at,added_at,format,lore,age_restricted,views";

const catSig=rows=>(rows[0]?.added_at?"a|":"")+rows.length+"|"+rows.map(r=>r.id).join(",").length+"|"+(rows[0]?.id||"")+"|"+(rows[rows.length-1]?.id||"");
let catLoaded="";
function useCatalog(rows){
  const sig=catSig(rows);if(sig===catLoaded)return 0;catLoaded=sig;
  const rowIds=new Set(rows.map(r=>r.id)),keep=FILMS.filter(f=>!f.db||(f.stub&&!rowIds.has(f.id)));FILMS.length=0;for(const f of keep)FILMS.push(f);
  const have=new Set(FILMS.map(f=>f.id)),known=new Set(CATS.map(c=>c.id));let n=0;
  const byId=new Map(FILMS.map(f=>[f.id,f]));
  rows.forEach((r,k)=>{
    // films added by hand that the importer also has: take YouTube's view count and dates from the database
    const own=byId.get(r.id);if(own){if(!own.ytViews&&r.views)own.ytViews=+r.views;if(!own.pub&&r.published_at)own.pub=Date.parse(r.published_at);if(!own.added&&r.added_at)own.added=Date.parse(r.added_at);if(own.days==null&&r.published_at)own.days=daysSince(Date.parse(r.published_at));return}

      len:d?`${Math.floor(d/60)}:${String(d%60).padStart(2,"0")}`:"",days:r.published_at?daysSince(Date.parse(r.published_at)):null,
      counts:[0,0,0,0,0],hue:(k*47)%360,format:r.format==="short"?"short":"film",lore:r.lore||"whatif",boost:Math.max(0,20-k/50),
      url:"https://www.youtube.com/watch?v="+r.video_id,age:!!r.age_restricted,ytViews:+r.views||0,db:true,pub:r.published_at?Date.parse(r.published_at):null,added:r.added_at?Date.parse(r.added_at):null});n++});

async function loadCatalog(){
  if(!sb)return;
  if(!catLoaded){try{const c=await idb("readonly",st=>st.get("catalog"));if(c?.rows?.length&&useCatalog(c.rows)){openLinkedFilm();render()}}catch(e){}}
  const page=async from=>{let r=await sb.from("catalog").select(CAT_COLS).eq("hidden",false).order("views",{ascending:false}).order("id").range(from,from+999);
    if(r.error)r=await sb.from("catalog").select("*").eq("hidden",false).order("views",{ascending:false}).order("id").range(from,from+999);
    if(r.error)throw r.error;return r.data||[]};
  const rows=[];
  for(let from=0;from<200000;from+=4000){
    const parts=await Promise.all([0,1000,2000,3000].map(o=>page(from+o)));
    for(const d of parts)rows.push(...d);if(parts.some(d=>d.length<1000))break;

  loadHandViews().catch(()=>{});
}
/* YouTube view counts and publish dates for films that aren't in the database (added by hand or by members), 50 per request, cached by the server */
